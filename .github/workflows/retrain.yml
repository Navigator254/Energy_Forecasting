name: Scheduled Retraining

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      EIA_PARENT_REGION: CISO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retraining pipeline
        run: |
          python - <<'PY'
          from src.services.retrain_service import run_retraining_pipeline
          result = run_retraining_pipeline(parent_region="CISO", subba=None)
          print(result)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retraining-artifacts
          path: |
            data/PJME_hourly.csv
            data/anomalies_detected.csv
            models/
